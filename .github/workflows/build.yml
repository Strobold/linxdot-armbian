name: Build Custom Armbian for Linxdot LD1002
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Linxdot Bootloader and Hardware Drivers
        run: |
          mkdir -p userpatches/mixins
          
          # 1. Automatische Passwörter setzen
          cat << 'EOF' > userpatches/config-default.conf
          PRESET_ROOT_PASSWORD="meingeheimespasswort"
          PRESET_USER_NAME="admin"
          PRESET_USER_PASSWORD="meinadminpasswort"
          PRESET_DEFAULT_REALNAME="Linxdot Admin"
          PRESET_LOCALE="en_US.UTF-8"
          PRESET_TIMEZONE="Europe/Berlin"
          EOF

          # 2. Netzwerk-Fix
          mkdir -p userpatches/kernel/rockchip-current/
          cat << 'EOF' > userpatches/kernel/rockchip-current/enable-generic-phy.patch
          --- a/arch/arm64/boot/dts/rockchip/rk3566-orangepi-3b.dts
          +++ b/arch/arm64/boot/dts/rockchip/rk3566-orangepi-3b.dts
          @@ -21,3 +21,7 @@
          &gmac1 {
              phy-mode = "rgmii-id";
              status = "okay";
          };
          EOF

      - name: Build Armbian Image
        uses: armbian/build@main
        continue-on-error: true # Ignoriert den Release-Fehler am Ende, damit der Upload läuft
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_board: orangepi3b
          armbian_target: build
          armbian_branch: main
          armbian_kernel_branch: current
          armbian_release: bookworm
          armbian_ui: minimal

      - name: Upload Linxdot Armbian Image
        uses: actions/upload-artifact@v4
        with:
          name: linxdot-armbian-image
          path: output/images/*.img.xz # Hier liegt das fertige Betriebssystem
